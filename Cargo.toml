[package]
name = "nanorust"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_Debug_Extensions", "Win32_System_SystemInformation"] }
log = "0.4.29"
env_logger = "0.11.8"
nt-string = "0.1.1"
ntapi = "0.4.3"
sysinfo = "0.38.1"
once_cell = "1.21.3"


[dependencies.windows]
version = "0.62.2"
features = ["Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Debug_Extensions",
    "Win32_System_Kernel"]
